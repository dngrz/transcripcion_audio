spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transcripcion_gestion}
    username: ${DB_USER:transcripcion}
    password: ${DB_PASSWORD:transcripcion}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

security:
  token-validation:
    enabled: true

logging:
  level:
    com.transcripcion.gestion: DEBUG
    org.hibernate.SQL: DEBUG
