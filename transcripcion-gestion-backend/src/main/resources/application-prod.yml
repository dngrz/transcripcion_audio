spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:transcripcion_gestion}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8080}

security:
  token-validation:
    enabled: true

logging:
  level:
    root: WARN
    com.transcripcion.gestion: INFO
