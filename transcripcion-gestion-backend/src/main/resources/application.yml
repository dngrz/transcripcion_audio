server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transcripcion-gestion-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 27MB
      # Mantiene el upload completo en memoria (evita archivos temporales).
      file-size-threshold: 30MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

# ---------------------------------------------------------------------
# Configuracion de la aplicacion
# ---------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-secret-key-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-transcribe}
    language: ${OPENAI_LANGUAGE:es}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Interruptor de validacion de token por perfil (seguro por defecto).
security:
  token-validation:
    enabled: ${TOKEN_VALIDATION_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.transcripcion.gestion: INFO
